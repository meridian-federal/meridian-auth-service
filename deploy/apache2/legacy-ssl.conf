# Meridian Auth Service — legacy Apache SSL config
# Used by the deprecated partner SSO endpoint (sunset planned 2027 Q1)

Listen 8443

<VirtualHost *:8443>
    ServerName legacy-sso.meridian-federal.internal

    SSLEngine on
    SSLProtocol -ALL +TLSv1 +TLSv1.1 +TLSv1.2
    SSLCipherSuite RSA+AES:!aNULL:!MD5:!RC4

    SSLCertificateFile /etc/apache2/ssl/legacy-sso.crt
    SSLCertificateKeyFile /etc/apache2/ssl/legacy-sso.key
</VirtualHost>
